<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IRRF eSocial</title>
    <link rel="stylesheet" href="/fonts/poppins.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="cabecalho">
      <h1>IRRF eSocial</h1>
      <span id="status" class="badge ocioso">ocioso</span>
    </header>

    <!-- ====================== Formulario ====================== -->
    <section id="formulario" class="cartao">
      <div id="esocial" class="esocial-status off">verificando eSocial&hellip;</div>

      <div class="linha">
        <label class="campo">
          <span>Competência inicial</span>
          <input
            type="text"
            id="compInicial"
            inputmode="numeric"
            maxlength="7"
            placeholder="MM/AAAA"
            autocomplete="off"
          />
        </label>
        <label class="campo">
          <span>Competência final</span>
          <input
            type="text"
            id="compFinal"
            inputmode="numeric"
            maxlength="7"
            placeholder="MM/AAAA"
            autocomplete="off"
          />
        </label>
      </div>

      <label class="campo">
        <span>CPFs (um por linha)</span>
        <textarea
          id="cpfs"
          rows="6"
          placeholder="123.456.789-00&#10;98765432100"
        ></textarea>
        <small id="resumoCpfs" class="dica"></small>
      </label>

      <button id="iniciar" class="primario">Iniciar</button>
    </section>

    <!-- ====================== Execucao ====================== -->
    <section id="execucao" class="cartao oculto">
      <div class="barra"><div id="barraProgresso" class="barra-fill"></div></div>

      <div class="tiles">
        <div class="tile"><strong id="tTotalCpfs">0</strong><small>CPFs</small></div>
        <div class="tile"><strong id="tProgresso">0/0</strong><small>tarefas</small></div>
        <div class="tile"><strong id="tXmls">0</strong><small>XMLs</small></div>
        <div class="tile"><strong id="tEta">&mdash;</strong><small>restante</small></div>
      </div>

      <dl class="atual">
        <div><dt>Competência atual</dt><dd id="aCompetencia">&mdash;</dd></div>
        <div><dt>CPF atual</dt><dd id="aCpf">&mdash;</dd></div>
        <div><dt>Colaborador</dt><dd id="aColaborador">&mdash;</dd></div>
      </dl>

      <div class="controles">
        <button id="pausar">Pausar</button>
        <button id="retomar">Retomar</button>
        <button id="cancelar" class="perigo">Cancelar</button>
      </div>
      <button id="reiniciar" class="link reiniciar oculto">Nova execução</button>

      <div id="erros" class="erros"></div>
    </section>

    <!-- ============== Gerador de Informe de Rendimentos ============== -->
    <section id="gerador" class="cartao">
      <h2 class="titulo-sec">Informe de Rendimentos</h2>
      <p class="dica">
        Gere os informes (PDF) a partir dos XMLs baixados — individual por
        colaborador ou todos num único PDF.
      </p>
      <button id="abrirGerador" class="primario">Abrir gerador de informes</button>
    </section>

    <script src="../common/namespace.js"></script>
    <script src="../common/constants.js"></script>
    <script src="../common/cpf.js"></script>
    <script src="../common/competencia.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
