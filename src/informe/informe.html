<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Informe de Rendimentos</title>
    <link rel="stylesheet" href="/fonts/poppins.css" />
    <link rel="stylesheet" href="informe.css" />
  </head>
  <body>
    <!-- Barra de ferramentas (aparece após carregar os XMLs) -->
    <div id="toolbar" class="toolbar oculto">
      <div class="grp">
        <label>Razão Social
          <input id="razao" type="text" placeholder="Nome da empresa (fonte pagadora)" />
        </label>
        <label>CNPJ
          <input id="cnpj" type="text" placeholder="00.000.000/0000-00" />
        </label>
      </div>
      <div class="grp" id="grpPessoa">
        <label>Colaborador
          <select id="pessoa"></select>
        </label>
      </div>
      <div class="grp acoes">
        <button id="btnPdf" class="primario">Baixar PDF</button>
        <label class="chk" id="lblQuebra">
          <input type="checkbox" id="quebra" /> Quebrar por empregado (.zip)
        </label>
        <button id="btnTrocar" class="link">Trocar pasta</button>
      </div>
      <div id="aviso" class="aviso"></div>
    </div>

    <!-- Upload da pasta -->
    <div id="upload" class="upload">
      <h1>Gerar Informe de Rendimentos</h1>
      <p>
        Selecione a pasta <b>IRRF eSocial</b> (todos os colaboradores) ou a pasta
        de um colaborador específico. Os XMLs são lidos <b>localmente</b>, no seu
        navegador — nada é enviado para fora.
      </p>
      <label class="botao-arquivo">
        Selecionar pasta de XMLs
        <input type="file" id="pasta" webkitdirectory directory multiple hidden />
      </label>
      <div id="statusUpload" class="status"></div>
    </div>

    <div id="preview" class="preview"></div>
    <div id="offscreen" aria-hidden="true"></div>

    <script src="/src/common/namespace.js"></script>
    <script src="/src/informe/informe-core.js"></script>
    <script src="/src/informe/informe-layout.js"></script>
    <script src="/src/informe/informe-export.js"></script>
    <script src="/src/informe/zip.js"></script>
    <script src="/src/informe/lookup.js"></script>
    <script src="informe.js"></script>
  </body>
</html>
